name: Algolia Package Reindex

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment for deployment"
        type: choice
        options:
          - prod
          - staging
        required: true

# The job needs nothing from the repository token beyond the checkout.
permissions:
  contents: read

jobs:
  reindex_algolia:
    runs-on: ubuntu-22.04
    environment:
      name: ${{ github.event.inputs.environment }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
      - name: Deploy
        env:
          ALGOLIA_APP_ID: ${{ vars.ALGOLIA_APP_ID }}
          ALGOLIA_WRITE_API_KEY: ${{ secrets.ALGOLIA_ADMIN_API_KEY }}
          ALGOLIA_PACKAGES_INDEX: ${{ github.event.inputs.environment }}_packages
          JSR_ENDPOINT_URL: ${{ vars.ENVIRONMENT_URL }}
        run: deno task tools:algolia:packages_reindex
