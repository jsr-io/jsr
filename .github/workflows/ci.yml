name: ci
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"
  merge_group:

env:
  TERRAFORM_VERSION: "1.4.2"

# Read-only by default; the jobs that need more declare their own block.
permissions:
  contents: read

jobs:
  frontend:
    if: github.event_name != 'push'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Clone repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5

      - name: Check license headers
        run: deno task lint:license

      - name: Format
        run: deno fmt --check
        working-directory: frontend

      - name: Lint
        run: deno task lint:frontend

      - name: Test
        run: deno task test
        working-directory: frontend

      - name: Build Frontend Worker
        run: deno task build
        working-directory: frontend

  worker:
    if: github.event_name != 'push'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Clone repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5

      - name: Check formatting
        run: deno fmt --check
        working-directory: lb

      - name: Lint
        run: deno task lint:lb

      - name: Build worker
        run: deno task build
        working-directory: lb

  api-wasm:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Clone repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust
        uses: dsherret/rust-toolchain-file@3551321aa44dd44a0393eb3b6bdfbc5d25ecf621 # v1

      - name: Add wasm target
        run: rustup target add wasm32-unknown-emscripten

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: emscripten
          cache-directories: ~/.cache/worker-build

      - uses: taiki-e/cache-cargo-install-action@9ee83daaa7b96a6fab930949ecf1122bba04a389 # v3.0.8
        with:
          tool: worker-build@0.9.0

      - name: Build API Cloudflare Worker
        run: ../tools/build-worker.sh
        working-directory: api

      - name: Build tasks Cloudflare Worker
        run: ../tools/build-worker.sh
        working-directory: tasks

      - name: Lint
        run: |
          cache=~/.cache/worker-build
          export PATH="$(echo $cache/emsdk-*/upstream/emscripten):$PATH"
          export EM_CONFIG="$(echo $cache/emscripten-*.config)"
          cargo clippy -p registry_api -p registry_api_tasks --target wasm32-unknown-emscripten -- -D warnings

      - name: Install Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5

      - name: Setup postgres for the smoke test
        run: docker compose up -d postgres

      - name: Smoke test
        run: deno task smoke:worker

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: api-wasm
          path: |
            api/build/index.js
            api/build/index_bg.wasm
            tasks/build/index.js
            tasks/build/index_bg.wasm

  check:
    runs-on: ubuntu-22.04
    if: github.event_name != 'push'
    steps:
      - name: Clone repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          lfs: true

      - name: Install Rust
        uses: dsherret/rust-toolchain-file@3551321aa44dd44a0393eb3b6bdfbc5d25ecf621 # v1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    runs-on: ubuntu-22.04
    if: github.event_name != 'push'
    steps:
      - name: Clone repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          lfs: true

      - name: Install Rust
        uses: dsherret/rust-toolchain-file@3551321aa44dd44a0393eb3b6bdfbc5d25ecf621 # v1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Setup postgres for tests
        run: docker compose up -d

      - name: Build
        run: cargo build --workspace --all-targets --tests

      - name: Test
        run: cargo test --workspace

  # The binary deploys run as `registry_api setup`, see terraform/api_setup.tf.
  api-setup:
    if: github.event_name == 'merge_group' || github.event_name == 'push' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'test-on-staging'))
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Clone repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust
        uses: dsherret/rust-toolchain-file@3551321aa44dd44a0393eb3b6bdfbc5d25ecf621 # v1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release

      - name: Build
        run: cargo build --release -p registry_api

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: api-setup
          path: target/release/registry_api

  staging:
    if: github.event_name == 'merge_group' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'test-on-staging'))
    runs-on: ubuntu-22.04
    needs: [api-wasm, api-setup]
    environment:
      name: staging
      url: https://deno-registry-staging.net
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Clone repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5

      - name: Install terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Authenticate with GCP
        id: gcp_auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          project_id: deno-registry3-staging
          workload_identity_provider: projects/1067420915575/locations/global/workloadIdentityPools/github-actions/providers/github-actions
          service_account: github-actions@deno-registry3-staging.iam.gserviceaccount.com

      - name: Build LB Cloudflare Worker
        run: deno task build
        working-directory: lb

      - name: Build Frontend
        run: deno task build
        working-directory: frontend

      - name: Download API and tasks Cloudflare Workers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: api-wasm

      - name: Download API setup binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: api-setup
          path: target/release

      # Artifacts don't keep the executable bit.
      - run: chmod +x target/release/registry_api

      - name: terraform plan
        run: |
          touch terraform/staging.secret.tfvars
          deno task tf:staging:init
          terraform version
          deno task tf:staging:plan
        env:
          TF_VAR_github_client_secret: ${{ secrets.GH_CLIENT_SECRET }}
          TF_VAR_gitlab_client_secret: ${{ secrets.GITLAB_CLIENT_SECRET }}
          TF_VAR_postmark_token: ${{ secrets.POSTMARK_TOKEN }}
          TF_VAR_algolia_app_id: ${{ vars.ALGOLIA_APP_ID }}
          TF_VAR_algolia_admin_api_key: ${{ secrets.ALGOLIA_ADMIN_API_KEY }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: terraform apply
        run: deno task tf:staging:apply

      - name: Database setup log
        if: always()
        run: cat terraform/api-setup.log || true

      - name: Run e2e tests
        run: deno task e2e:staging

      - name: Reindex algolia docs search
        env:
          ALGOLIA_APP_ID: ${{ vars.ALGOLIA_APP_ID }}
          ALGOLIA_WRITE_API_KEY: ${{ secrets.ALGOLIA_ADMIN_API_KEY }}
          ALGOLIA_DOCS_INDEX: staging_docs
        run: deno task tools:algolia:docs_reindex

  prod:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    needs: [api-wasm, api-setup]
    environment:
      name: prod
      url: https://jsr.io
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Clone repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5

      - name: Install terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Authenticate with GCP
        id: gcp_auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          project_id: deno-registry3-prod
          workload_identity_provider: projects/614736529383/locations/global/workloadIdentityPools/github-actions/providers/github-actions
          service_account: github-actions@deno-registry3-prod.iam.gserviceaccount.com

      - name: Build LB Cloudflare Worker
        run: deno task build
        working-directory: lb

      - name: Build Frontend
        run: deno task build
        working-directory: frontend

      - name: Download API and tasks Cloudflare Workers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: api-wasm

      - name: Download API setup binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: api-setup
          path: target/release

      # Artifacts don't keep the executable bit.
      - run: chmod +x target/release/registry_api

      - name: terraform plan
        run: |
          touch terraform/prod.secret.tfvars
          deno task tf:prod:init
          terraform version
          deno task tf:prod:plan
        env:
          TF_VAR_github_client_secret: ${{ secrets.GH_CLIENT_SECRET }}
          TF_VAR_gitlab_client_secret: ${{ secrets.GITLAB_CLIENT_SECRET }}
          TF_VAR_postmark_token: ${{ secrets.POSTMARK_TOKEN }}
          TF_VAR_algolia_app_id: ${{ vars.ALGOLIA_APP_ID }}
          TF_VAR_algolia_admin_api_key: ${{ secrets.ALGOLIA_ADMIN_API_KEY }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: terraform apply
        run: deno task tf:prod:apply

      - name: Database setup log
        if: always()
        run: cat terraform/api-setup.log || true

      - name: Run e2e tests
        run: deno task e2e:prod

      - name: Reindex algolia docs search
        env:
          ALGOLIA_APP_ID: ${{ vars.ALGOLIA_APP_ID }}
          ALGOLIA_WRITE_API_KEY: ${{ secrets.ALGOLIA_ADMIN_API_KEY }}
          ALGOLIA_DOCS_INDEX: prod_docs
        run: deno task tools:algolia:docs_reindex
