name: ci
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"
  merge_group:

env:
  TERRAFORM_VERSION: "1.4.2"

# Read-only by default; the jobs that need more declare their own block.
permissions:
  contents: read

jobs:
  frontend:
    if: github.event_name != 'push'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Clone repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5

      - name: Check license headers
        run: deno task lint:license

      - name: Format
        run: deno fmt --check
        working-directory: frontend

      - name: Lint
        run: deno task lint:frontend

      - name: Test
        run: deno task test
        working-directory: frontend

      - name: Build Frontend Worker
        run: deno task build
        working-directory: frontend

  worker:
    if: github.event_name != 'push'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Clone repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5

      - name: Check formatting
        run: deno fmt --check
        working-directory: lb

      - name: Lint
        run: deno task lint:lb

      - name: Build worker
        run: deno task build
        working-directory: lb

  api-worker:
    if: github.event_name != 'push'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Clone repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust
        uses: dsherret/rust-toolchain-file@3551321aa44dd44a0393eb3b6bdfbc5d25ecf621 # v1

      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: workers-rs

      - name: Format
        run: cargo fmt --check
        working-directory: workers-rs

      - name: Lint
        run: cargo clippy --target wasm32-unknown-unknown -- -D warnings
        working-directory: workers-rs

      - name: Build worker (wasm)
        run: cargo build --target wasm32-unknown-unknown --release
        working-directory: workers-rs

  check:
    runs-on: ubuntu-22.04
    if: github.event_name != 'push'
    steps:
      - name: Clone repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          lfs: true

      - name: Install Rust
        uses: dsherret/rust-toolchain-file@3551321aa44dd44a0393eb3b6bdfbc5d25ecf621 # v1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Format
        run: cargo fmt --all -- --check
        working-directory: api

      - name: Setup postgres for tests
        run: docker compose up -d

      - uses: taiki-e/cache-cargo-install-action@9ee83daaa7b96a6fab930949ecf1122bba04a389 # v3.0.8
        with:
          tool: sqlx-cli@0.7.1

      - name: Check sqlx metadata is up to date
        run: |
          cargo sqlx migrate run
          cargo sqlx prepare --check -- --all-targets
        working-directory: api
        env:
          DATABASE_URL: postgres://user:password@localhost/registry

      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: api

  test:
    runs-on: ubuntu-22.04
    if: github.event_name != 'push'
    steps:
      - name: Clone repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          lfs: true

      - name: Install Rust
        uses: dsherret/rust-toolchain-file@3551321aa44dd44a0393eb3b6bdfbc5d25ecf621 # v1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Setup postgres for tests
        run: docker compose up -d

      - name: Build
        run: cargo build --all-targets --tests
        working-directory: api

      - name: Test
        run: cargo test
        working-directory: api

  docker-images:
    if: github.event_name == 'merge_group' || github.event_name == 'push' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'test-on-staging'))
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    env:
      API_IMAGE_ID_BASE: us-central1-docker.pkg.dev/deno-registry3-infra/registry/api
    outputs:
      api_image_id: ${{ steps.api_image_id.outputs.image_id }}
    steps:
      - name: Clone repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Authenticate with GCP
        id: gcp_auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          project_id: deno-registry3-infra
          token_format: access_token
          workload_identity_provider: projects/289615555261/locations/global/workloadIdentityPools/github-actions/providers/github-actions
          service_account: github-actions@deno-registry3-infra.iam.gserviceaccount.com

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: us-central1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.gcp_auth.outputs.access_token }}

      # On push to main, try to reuse images already built during merge_group.
      # Falls back to building if the images don't exist (e.g. admin bypass).
      - name: Check if images already exist
        if: github.event_name == 'push'
        id: check_existing
        run: |
          if docker manifest inspect ${{ env.API_IMAGE_ID_BASE }}:${{ github.sha }} > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up docker buildx
        if: github.event_name != 'push' || steps.check_existing.outputs.exists != 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and push api docker image
        if: github.event_name != 'push' || steps.check_existing.outputs.exists != 'true'
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        id: api_push
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: ${{ env.API_IMAGE_ID_BASE }}:${{ github.sha }}
          # Use a registry cache (not type=gha): GHA caches are branch-scoped,
          # and merge_group runs execute on transient refs, so a gha cache
          # written there is never readable by later runs. A registry cache is
          # shared across all refs. image-manifest/oci-mediatypes are required
          # for Artifact Registry to accept the cache manifest.
          cache-from: type=registry,ref=${{ env.API_IMAGE_ID_BASE }}:buildcache
          cache-to: type=registry,ref=${{ env.API_IMAGE_ID_BASE }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true

      - name: Set api_image_id output
        id: api_image_id
        run: |
          if [ -n "${{ steps.api_push.outputs.imageid }}" ]; then
            echo "image_id=${{ env.API_IMAGE_ID_BASE }}@${{ steps.api_push.outputs.imageid }}" >> $GITHUB_OUTPUT
          else
            echo "image_id=${{ env.API_IMAGE_ID_BASE }}:${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

  staging:
    if: github.event_name == 'merge_group' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'test-on-staging'))
    runs-on: ubuntu-22.04
    needs: docker-images
    environment:
      name: staging
      url: https://deno-registry-staging.net
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Clone repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5

      - name: Install terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Authenticate with GCP
        id: gcp_auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          project_id: deno-registry3-staging
          workload_identity_provider: projects/1067420915575/locations/global/workloadIdentityPools/github-actions/providers/github-actions
          service_account: github-actions@deno-registry3-staging.iam.gserviceaccount.com

      - name: Build LB Cloudflare Worker
        run: deno task build
        working-directory: lb

      - name: Build Frontend
        run: deno task build
        working-directory: frontend

      - name: terraform plan
        run: |
          touch terraform/staging.secret.tfvars
          deno task tf:staging:init
          terraform version
          deno task tf:staging:plan
        env:
          API_IMAGE_ID: ${{ needs.docker-images.outputs.api_image_id }}
          TF_VAR_github_client_secret: ${{ secrets.GH_CLIENT_SECRET }}
          TF_VAR_gitlab_client_secret: ${{ secrets.GITLAB_CLIENT_SECRET }}
          TF_VAR_postmark_token: ${{ secrets.POSTMARK_TOKEN }}
          TF_VAR_postmark_webhook_password: ${{ secrets.POSTMARK_WEBHOOK_PASSWORD }}
          TF_VAR_algolia_app_id: ${{ vars.ALGOLIA_APP_ID }}
          TF_VAR_algolia_admin_api_key: ${{ secrets.ALGOLIA_ADMIN_API_KEY }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_otlp_headers: ${{ secrets.OTLP_HEADERS }}

      - name: terraform apply
        run: deno task tf:staging:apply

      - name: Run e2e tests
        run: deno task e2e:staging

      - name: Reindex algolia docs search
        env:
          ALGOLIA_APP_ID: ${{ vars.ALGOLIA_APP_ID }}
          ALGOLIA_WRITE_API_KEY: ${{ secrets.ALGOLIA_ADMIN_API_KEY }}
          ALGOLIA_DOCS_INDEX: staging_docs
        run: deno task tools:algolia:docs_reindex

  prod:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    needs: docker-images
    environment:
      name: prod
      url: https://jsr.io
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Clone repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5

      - name: Install terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Authenticate with GCP
        id: gcp_auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          project_id: deno-registry3-prod
          workload_identity_provider: projects/614736529383/locations/global/workloadIdentityPools/github-actions/providers/github-actions
          service_account: github-actions@deno-registry3-prod.iam.gserviceaccount.com

      - name: Build LB Cloudflare Worker
        run: deno task build
        working-directory: lb

      - name: Build Frontend
        run: deno task build
        working-directory: frontend

      - name: terraform plan
        run: |
          touch terraform/prod.secret.tfvars
          deno task tf:prod:init
          terraform version
          deno task tf:prod:plan
        env:
          API_IMAGE_ID: ${{ needs.docker-images.outputs.api_image_id }}
          TF_VAR_github_client_secret: ${{ secrets.GH_CLIENT_SECRET }}
          TF_VAR_gitlab_client_secret: ${{ secrets.GITLAB_CLIENT_SECRET }}
          TF_VAR_postmark_token: ${{ secrets.POSTMARK_TOKEN }}
          TF_VAR_postmark_webhook_password: ${{ secrets.POSTMARK_WEBHOOK_PASSWORD }}
          TF_VAR_algolia_app_id: ${{ vars.ALGOLIA_APP_ID }}
          TF_VAR_algolia_admin_api_key: ${{ secrets.ALGOLIA_ADMIN_API_KEY }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_otlp_headers: ${{ secrets.OTLP_HEADERS }}

      - name: terraform apply
        run: deno task tf:prod:apply

      - name: Run e2e tests
        run: deno task e2e:prod

      - name: Reindex algolia docs search
        env:
          ALGOLIA_APP_ID: ${{ vars.ALGOLIA_APP_ID }}
          ALGOLIA_WRITE_API_KEY: ${{ secrets.ALGOLIA_ADMIN_API_KEY }}
          ALGOLIA_DOCS_INDEX: prod_docs
        run: deno task tools:algolia:docs_reindex
