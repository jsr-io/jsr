[package]
name = "registry_api"
version = "1.1.0"
edition = "2024"
resolver = "2"

[dependencies]
sqlx.workspace = true
urlencoding = "2.1.3"
anyhow.workspace = true
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
oauth2 = "4.4.1"
futures.workspace = true
hyper.workspace = true
once_cell.workspace = true
percent-encoding.workspace = true
rand.workspace = true
ring = "0.17"
sha2.workspace = true
crc32fast = "1.3.2"
routerify.workspace = true
routerify-query.workspace = true
reqwest.workspace = true
rmp-serde.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
url.workspace = true
uuid.workspace = true
clap = { version = "4", default-features = false, features = [
    "derive",
    "std",
    "env",
    "help",
    "usage",
    "error-context",
    "suggestions",
] }
dotenvy.workspace = true
tar.workspace = true
tracing.workspace = true
tracing-futures = "0.2"
rust-s3.workspace = true
deno_semver.workspace = true
flate2.workspace = true
thiserror.workspace = true
deno_graph.workspace = true
deno_ast.workspace = true
deno_doc.workspace = true
deno_error.workspace = true
comrak.workspace = true
ammonia = "4.0.0"
async-trait.workspace = true
jsonwebkey = { version = "0.3.5", features = ["jsonwebtoken", "jwt-convert"] }
jsonwebtoken = "8.3.0"
indexmap.workspace = true
regex.workspace = true
handlebars = "5.0.0"
x509-parser = { version = "0.15.1", features = ["verify"] }
sitemap-rs = "0.2.1"
moka = { version = "0.12", features = ["future", "sync"] }

tree-sitter-highlight = "0.22.6"
tree-sitter-javascript = "0.21.4"
tree-sitter-typescript = "0.21.2"
tree-sitter-json = "0.21.0"
tree-sitter-regex = "0.21.0"
tree-sitter-css = "0.21.0"
tree-sitter-md = "0.2.3"
tree-sitter-rust = "0.21.2"
tree-sitter-html = "0.20.3"
tree-sitter-bash = "0.21.0"
tree-sitter-xml = "0.6.4"
tree-sitter-toml-ng = "0.6.0"
tree-sitter-yaml = "0.6.1"
tree-sitter-c = "0.21.4"
lazy_static = "1.5.0"
tikv-jemallocator = { version = "0.6", features = ["profiling"] }
tikv-jemalloc-ctl = { version = "0.6", features = ["stats"] }
shared = { path = "../shared", package = "registry_api_shared" }

[dev-dependencies]
flate2.workspace = true
deno_semver = "0.10.1"
pretty_assertions = "1.4.0"
tokio-stream = "0.1"
shared = { path = "../shared", package = "registry_api_shared", features = ["testing"] }
