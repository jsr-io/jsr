[package]
name = "registry_api"
version = "1.1.0"
edition = "2024"
resolver = "2"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
clap.workspace = true
deno_ast.workspace = true
deno_doc.workspace = true
deno_error.workspace = true
deno_graph.workspace = true
deno_semver.workspace = true
dotenvy.workspace = true
flate2.workspace = true
futures.workspace = true
hyper.workspace = true
indexmap.workspace = true
moka.workspace = true
once_cell.workspace = true
percent-encoding.workspace = true
rand.workspace = true
regex.workspace = true
reqwest.workspace = true
rmp-serde.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
thiserror.workspace = true
tokio.workspace = true
tower.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true

urlencoding = "2.1.3"
# `default-features = false` leaves out oauth2's own reqwest client; the flows
# go through `util::oauth2_http_request` on the app's reqwest instead.
oauth2 = { version = "5", default-features = false }
ring = "0.17"
crc32fast.workspace = true
tokio-stream = "0.1"
comrak = { version = "0.56.0", default-features = false }
ammonia = "4.0.0"
handlebars = "5.0.0"
x509-parser = { version = "0.18", features = ["verify"] }
sitemap-rs = "0.2.1"

tree-sitter-highlight = "0.27"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-json = "0.24"
tree-sitter-regex = "0.25"
tree-sitter-css = "0.25"
tree-sitter-md = "0.5"
tree-sitter-rust = "0.24"
tree-sitter-html = "0.23"
tree-sitter-bash = "0.25"
tree-sitter-xml = "0.7"
tree-sitter-toml-ng = "0.7"
tree-sitter-yaml = "0.7"
tree-sitter-c = "0.24"
lazy_static = "1.5.0"
shared = { path = "../shared", package = "registry_api_shared" }
registry_api_tasks = { path = "../tasks" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
worker.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys.workspace = true
worker-sys.workspace = true
# aws-lc doesn't build for emscripten.
jsonwebtoken = { version = "11", features = ["rust_crypto"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["full"] }
tikv-jemallocator = { version = "0.6", features = ["profiling"] }
tikv-jemalloc-ctl = { version = "0.6", features = ["stats"] }
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }

[dev-dependencies]
pretty_assertions.workspace = true
shared = { path = "../shared", package = "registry_api_shared", features = [
    "testing",
] }
