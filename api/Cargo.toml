[package]
name = "registry_api"
version = "1.1.0"
edition = "2024"
resolver = "2"

[dependencies]
sqlx = { version = "0.8.6", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "migrate",
    "postgres",
    "macros",
    "uuid",
    "chrono",
    "json",
    "ipnetwork",
] }
urlencoding = "2.1.3"
anyhow = "1"
base64 = "0.21"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
# `default-features = false` leaves out oauth2's own reqwest client; the flows
# go through `util::oauth2_http_request` on the app's reqwest instead.
oauth2 = { version = "5", default-features = false }
futures = "0.3"
hyper = "1"
axum = { version = "0.8", default-features = false, features = [
    "http1",
    "http2",
    "tokio",
] }
tower = { version = "0.5", features = ["util"] }
once_cell = "1"
percent-encoding = "2"
rand = "0.8"
ring = "0.17"
sha2 = "0.10.7"
crc32fast = "1.3.2"
# The S3 client (`s3.rs`) shares this reqwest but builds its own `Client` with
# `no_gzip()`/`no_brotli()`: objects we store gzip-encoded (tarballs, docs)
# must come back from the bucket as stored, not transparently inflated.
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "http2",
    "gzip",
    "brotli",
    "json",
    "form",
    # `Response::bytes_stream`, for streaming S3 downloads.
    "stream",
    # For the OTLP exporters' client, see `tracing.rs`.
    "blocking",
] }
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `full` minus the features tokio refuses to build on wasm32-unknown-emscripten:
# `process`/`signal` are unsupported there, and `rt-multi-thread` needs pthreads
# (the emscripten runtime is single-threaded). Native re-adds `full` below.
tokio = { version = "1", features = [
    "fs",
    "io-util",
    "io-std",
    "macros",
    "net",
    "parking_lot",
    "rt",
    "sync",
    "time",
] }
tokio-stream = "0.1"
url = "2.5.4"
uuid = { version = "1", features = ["v4", "serde"] }
clap = { version = "4", default-features = false, features = [
    "derive",
    "std",
    "env",
    "help",
    "usage",
    "error-context",
    "suggestions",
] }
dotenvy = "0.15.7"
const_format = { version = "0.2", features = ["const_generics"] }
tar = "0.4"
tracing = "0.1"
tracing-futures = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# wasm32 (emscripten worker): drop `tokio-rustls-tls`, which drags in
# aws-creds/rustls-tls -> attohttpc -> rustls(aws-lc), and aws-lc-sys won't
# build for emscripten. jsr uses static S3 creds, so aws-creds' HTTP credential
# fetching (the only attohttpc user) is dead weight; reqwest handles the S3 TLS.
# The native compute service keeps the original rustls S3 stack below.
# Signs S3 requests only; `s3.rs` sends them with the reqwest client above.
rusty-s3 = "0.10.2"
deno_semver = "0.10.1"
flate2 = "1"
thiserror = "2"
deno_graph = "=0.111.0"
deno_ast = { version = "0.53.0", features = ["view"] }
# sync with frontend/deno.json
deno_doc = { version = "=0.209.0", features = ["comrak"] }
deno_error = "0.7.0"
comrak = { version = "0.56.0", default-features = false }
ammonia = "4.0.0"
async-trait = "0.1.73"
indexmap = { version = "2.13.0", features = ["serde"] }
pin-project = "1.1.3"
regex = "1.10.2"
postmark = { version = "2", features = ["reqwest-rustls-tls"] }
handlebars = "5.0.0"
jsonc-parser = { version = "0.26.3", features = ["serde"] }
sha1 = "0.10.6"
infer = "0.15.0"
x509-parser = { version = "0.18", features = ["verify"] }
sitemap-rs = "0.2.1"
# `gzip` feature: askalono otherwise compresses its license cache with zstd
# (zstd-sys C lib, unavailable on wasm) and selects the codec by feature, not
# target. gzip (flate2) builds everywhere. Must match the build-dependency
# askalono below, since it generates the cache build.rs embeds.
askalono = { version = "0.5.0", features = ["gzip"] }
moka = { version = "0.12", features = ["future", "sync"] }

tree-sitter-highlight = "0.27"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-json = "0.24"
tree-sitter-regex = "0.25"
tree-sitter-css = "0.25"
tree-sitter-md = "0.5"
tree-sitter-rust = "0.24"
tree-sitter-html = "0.23"
tree-sitter-bash = "0.25"
tree-sitter-xml = "0.7"
tree-sitter-toml-ng = "0.7"
tree-sitter-yaml = "0.7"
tree-sitter-c = "0.24"
lazy_static = "1.5.0"
registry_api_macros = { path = "macros" }
jsr_types = { path = "../crates/jsr_types", features = ["sqlx"] }

# emscripten worker entry point (`fetch` export) bridges web_sys Request/Response
# to hyper. These match the wasm-bindgen version the workers-rs post-link CLI
# expects (pinned via the [patch] block in the workspace Cargo.toml).
[target.'cfg(target_arch = "wasm32")'.dependencies]
# `worker-build --emscripten` version-locks its toolchain against the SDK crate
# and refuses to run without it in the graph, and it reads the
# `experimental_tokio` feature to decide whether to pass `--cfg=tokio_unstable
# --cfg=wasm_bindgen_unstable_tokio`. registry_api does not use the SDK's
# router/macros — the `fetch` export below is raw wasm-bindgen.
worker = { version = "0.8.7", features = ["experimental_tokio"] }
wasm-bindgen = "0.2"
# The hosted runtime `#[wasm_bindgen(experimental_tokio)]` (the `fetch` export)
# schedules its future onto lives here. It needs no feature: wasm-bindgen-futures
# takes its tokio dependency under `cfg(all(target_os = "emscripten",
# wasm_bindgen_unstable_tokio))`, the cfg the build supplies.
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Headers",
    "Request",
    "Response",
    "ResponseInit",
] }
# jsonwebtoken's crypto backend, pure Rust instead of the native `aws_lc_rs`
# below: aws-lc-sys does not build for emscripten. Declared per target rather
# than once with both features, because the two backends do not unify.
jsonwebtoken = { version = "11", features = ["rust_crypto"] }

# jemalloc has no wasm32 build; keep it (and its profiling endpoints) only for
# the native compute service.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The native server keeps all of tokio: `#[tokio::main]` is multi-threaded and
# the shutdown path listens for signals.
tokio = { version = "1", features = ["full"] }
tikv-jemallocator = { version = "0.6", features = ["profiling"] }
tikv-jemalloc-ctl = { version = "0.6", features = ["stats"] }
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
# OpenTelemetry/OTLP export is native-only. The worker always runs with OTLP
# disabled (empty endpoint), so this whole stack would be megabytes of
# never-executed code in the wasm binary. Gating it here keeps the worker's
# stdout tracing intact while dropping the exporter.
tracing-opentelemetry = "0.33"
opentelemetry = { version = "0.32", features = ["trace", "logs"] }
opentelemetry_sdk = { version = "0.32.1", features = ["trace", "logs"] }
# Bridges `tracing` events into OpenTelemetry log records so the same logs we
# print to stdout are also exported over OTLP (to Grafana Cloud Loki).
opentelemetry-appender-tracing = "0.32"
# OTLP over HTTP/protobuf (not gRPC): the managed Grafana Cloud OTLP gateway only
# speaks OTLP/HTTP. The SDK's batch processors run on their own thread and
# block on the export future, so the exporter needs a blocking HTTP client:
# `reqwest-blocking-client` (shares the app's reqwest 0.13) and
# `reqwest-rustls` for TLS to the https endpoint. Default
# `grpc-tonic` is off. `http-proto` enables trace+metrics; `logs` is listed
# explicitly because it does not.
opentelemetry-otlp = { version = "0.32", default-features = false, features = [
    "trace",
    "logs",
    "http-proto",
    "reqwest-blocking-client",
    "reqwest-rustls",
] }

[build-dependencies]
# Keep the codec in sync with the runtime askalono dep (gzip, not zstd), so the
# cache generated here matches what `util::license_store` reads back.
askalono = { version = "0.5.0", features = ["gzip"] }

[dev-dependencies]
flate2 = "1"
deno_semver = "0.10.1"
pretty_assertions = "1.4.0"
jsr_types = { path = "../crates/jsr_types", features = ["sqlx", "testing"] }
