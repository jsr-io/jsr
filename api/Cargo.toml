[package]
name = "registry_api"
version = "1.1.0"
edition = "2024"
resolver = "2"

[dependencies]
sqlx = { version = "0.8.6", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "migrate",
    "postgres",
    "macros",
    "uuid",
    "chrono",
    "json",
    "ipnetwork",
] }
urlencoding = "2.1.3"
anyhow = "1"
base64 = "0.21"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
oauth2 = "4.4.1"
futures = "0.3"
hyper = { version = "0.14", features = [
    "http1",
    "http2",
    "client",
    "server",
    "stream",
] }
once_cell = "1"
percent-encoding = "2"
rand = "0.8"
ring = "0.17"
sha2 = "0.10.7"
crc32fast = "1.3.2"
routerify = "3"
routerify-query = "3"
reqwest = { version = "0.11.18", default-features = false, features = [
    "rustls-tls",
    "stream",
    "gzip",
    "brotli",
    "json",
    "multipart",
] }
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
url = "2.5.4"
uuid = { version = "1", features = ["v4", "serde"] }
clap = { version = "4", default-features = false, features = [
    "derive",
    "std",
    "env",
    "help",
    "usage",
    "error-context",
    "suggestions",
] }
dotenvy = "0.15.7"
const_format = { version = "0.2", features = ["const_generics"] }
tar = "0.4"
tracing = "0.1"
tracing-futures = "0.2"
tracing-opentelemetry = "0.28"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
opentelemetry = { version = "0.27", features = ["trace", "logs"] }
opentelemetry_sdk = { version = "0.27", features = [
    "rt-tokio",
    "trace",
    "logs",
] }
# Bridges `tracing` events into OpenTelemetry log records so the same logs we
# print to stdout are also exported over OTLP (to Grafana Cloud Loki).
opentelemetry-appender-tracing = "0.27"
# OTLP over HTTP/protobuf (not gRPC): the managed Grafana Cloud OTLP gateway only
# speaks OTLP/HTTP. `reqwest-client` routes export through reqwest (its own
# reqwest 0.12, separate from the app's reqwest 0.11). Default `grpc-tonic` is
# off. `http-proto` enables trace+metrics; `logs` is listed explicitly because
# it does not.
opentelemetry-otlp = { version = "0.27", default-features = false, features = [
    "trace",
    "logs",
    "http-proto",
    "reqwest-client",
] }
# wasm32 (emscripten worker): drop `tokio-rustls-tls`, which drags in
# aws-creds/rustls-tls -> attohttpc -> rustls(aws-lc), and aws-lc-sys won't
# build for emscripten. jsr uses static S3 creds, so aws-creds' HTTP credential
# fetching (the only attohttpc user) is dead weight; reqwest handles the S3 TLS.
# The native compute service keeps the original rustls S3 stack below.
rust-s3 = { version = "0.37.1", default-features = false, features = ["with-tokio", "tokio"] }
deno_semver = "0.10.1"
flate2 = "1"
thiserror = "2"
# Async tarball reading built on tokio (not async-std): tokio works on
# wasm32-emscripten, so this replaces async-tar (which drags in async-std's
# async-io epoll reactor and can't build for wasm). `default-features = false`
# drops the unix-only `xattr` extraction feature we don't use (read-only).
astral-tokio-tar = { version = "0.6", default-features = false }
async-compression = { version = "0.4", features = ["tokio", "gzip"] }
# `compat` bridges the S3 download's futures-io AsyncRead to tokio's AsyncRead.
tokio-util = { version = "0.7", features = ["compat"] }
deno_graph = "=0.109.0"
deno_ast = { version = "0.53.0", features = ["view"] }
# sync with frontend/deno.json
deno_doc = { version = "=0.201.0", features = ["comrak"] }
deno_error = "0.7.0"
comrak = { version = "0.29.0", default-features = false }
ammonia = "4.0.0"
async-trait = "0.1.73"
jsonwebkey = { version = "0.4.0", features = ["jsonwebtoken", "jwt-convert"] }
jsonwebtoken = "10"
indexmap = { version = "2.13.0", features = ["serde"] }
pin-project = "1.1.3"
regex = "1.10.2"
postmark = { version = "=0.10.0", features = ["reqwest-rustls-tls"] }
handlebars = "5.0.0"
jsonc-parser = { version = "0.26.3", features = ["serde"] }
sha1 = "0.10.6"
infer = "0.15.0"
x509-parser = { version = "0.16", features = ["verify"] }
sitemap-rs = "0.2.1"
# `gzip` feature: askalono otherwise compresses its license cache with zstd
# (zstd-sys C lib, unavailable on wasm) and selects the codec by feature, not
# target. gzip (flate2) builds everywhere. Must match the build-dependency
# askalono below, since it generates the cache build.rs embeds.
askalono = { version = "0.5.0", features = ["gzip"] }
moka = { version = "0.12", features = ["future"] }

tree-sitter-highlight = "0.22.6"
tree-sitter-javascript = "0.21.4"
tree-sitter-typescript = "0.21.2"
tree-sitter-json = "0.21.0"
tree-sitter-regex = "0.21.0"
tree-sitter-css = "0.21.0"
tree-sitter-md = "0.2.3"
tree-sitter-rust = "0.21.2"
tree-sitter-html = "0.20.3"
tree-sitter-bash = "0.21.0"
tree-sitter-xml = "0.6.4"
lazy_static = "1.5.0"
registry_api_macros = { path = "macros" }
jsr_types = { path = "../crates/jsr_types", features = ["sqlx"] }

# emscripten worker entry point (`fetch` export) bridges web_sys Request/Response
# to hyper. These match the wasm-bindgen version the workers-rs post-link CLI
# expects (pinned via the [patch] block in the workspace Cargo.toml).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Headers",
    "Request",
    "Response",
    "ResponseInit",
] }

# jemalloc has no wasm32 build; keep it (and its profiling endpoints) only for
# the native compute service.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tikv-jemallocator = { version = "0.6", features = ["profiling"] }
tikv-jemalloc-ctl = { version = "0.6", features = ["stats"] }
# Native keeps the original rustls-based S3 TLS stack (feature-unifies with the
# base rust-s3 dep above).
rust-s3 = { version = "0.37.1", features = ["tokio-rustls-tls"] }

[build-dependencies]
# Keep the codec in sync with the runtime askalono dep (gzip, not zstd), so the
# cache generated here matches what `util::license_store` reads back.
askalono = { version = "0.5.0", features = ["gzip"] }

[dev-dependencies]
flate2 = "1"
deno_semver = "0.10.1"
pretty_assertions = "1.4.0"
jsr_types = { path = "../crates/jsr_types", features = ["sqlx", "testing"] }
