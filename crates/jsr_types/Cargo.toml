[package]
name = "jsr_types"
version = "0.1.0"
edition = "2024"
resolver = "2"

[features]
default = []
# Enables the `postgres-types` `FromSql`/`ToSql` impls on the model and id
# types. The API server enables this.
postgres = ["dep:postgres-types", "dep:bytes"]
# Exposes test-only constructors (e.g. `ExportsMap::mock()`) to downstream
# crates' test builds.
testing = []

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Only the `Uuid` type + serde are needed here; v4 generation (which pulls
# `getrandom`, not wasm-safe by default) stays in the consuming crates.
uuid = { version = "1", features = ["serde"] }
deno_semver = "0.10.1"
thiserror = "2"
indexmap = { version = "2.13.0", features = ["serde"] }
postgres-types = { version = "0.2.14", optional = true, features = [
    "derive",
    "with-chrono-0_4",
    "with-uuid-1",
    "with-serde_json-1",
] }
bytes = { version = "1", optional = true }
