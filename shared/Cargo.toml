[package]
name = "registry_api_shared"
version = "0.1.0"
edition = "2024"
resolver = "2"

[features]
default = []
# Exposes the test harness (`test::TestSetup`, tarball fixtures) and test-only
# constructors (e.g. `ExportsMap::mock()`) to downstream crates' test builds.
testing = ["dep:tar"]

[dependencies]
anyhow.workspace = true
askalono.workspace = true
axum.workspace = true
bytes.workspace = true
chrono.workspace = true
crc32fast.workspace = true
deno_ast.workspace = true
deno_doc.workspace = true
deno_error.workspace = true
deno_graph.workspace = true
deno_semver.workspace = true
dotenvy.workspace = true
flate2.workspace = true
futures.workspace = true
hyper.workspace = true
indexmap.workspace = true
moka.workspace = true
once_cell.workspace = true
percent-encoding.workspace = true
rand.workspace = true
reqwest.workspace = true
rmp-serde.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar = { workspace = true, optional = true }
thiserror.workspace = true
tokio.workspace = true
tower.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true

# `runtime` (connecting over tokio sockets) is native-only; the worker
# connects through Hyperdrive.
tokio-postgres = { version = "0.7.18", default-features = false, features = [
    "with-chrono-0_4",
    "with-uuid-1",
    "with-serde_json-1",
] }
postgres-types = { version = "0.2.14", features = [
    "with-chrono-0_4",
    "with-uuid-1",
    "with-serde_json-1",
] }
deadpool-postgres = "0.14.2"
const_format = { version = "0.2", features = ["const_generics"] }
pin-project = "1.1.3"
postmark = { version = "2", features = ["reqwest-rustls-tls"] }
rusty-s3 = "0.10.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
worker-sys.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys.workspace = true
# aws-lc doesn't build for emscripten.
jsonwebtoken = { version = "11", features = ["rust_crypto"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["full"] }
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
tokio-postgres = { version = "0.7.18", features = ["runtime"] }
# The worker reaches the database through Hyperdrive, which terminates TLS.
tokio-postgres-rustls = { version = "0.14.0", features = ["aws-lc-rs"] }
rustls = { version = "0.23", default-features = false, features = [
    "aws_lc_rs",
    "std",
    "tls12",
] }
tracing-opentelemetry = "0.33"
opentelemetry = { version = "0.32", features = ["trace", "logs"] }
opentelemetry_sdk = { version = "0.32.1", features = ["trace", "logs"] }
# Bridges `tracing` events into OpenTelemetry log records so the same logs we
# print to stdout are also exported over OTLP (to Grafana Cloud Loki).
opentelemetry-appender-tracing = "0.32"
# OTLP over HTTP/protobuf (not gRPC): the managed Grafana Cloud OTLP gateway only
# speaks OTLP/HTTP. The SDK's batch processors run on their own thread and
# block on the export future, so the exporter needs a blocking HTTP client:
# `reqwest-blocking-client` (shares the app's reqwest 0.13) and
# `reqwest-rustls` for TLS to the https endpoint. Default
# `grpc-tonic` is off. `http-proto` enables trace+metrics; `logs` is listed
# explicitly because it does not.
opentelemetry-otlp = { version = "0.32", default-features = false, features = [
    "trace",
    "logs",
    "http-proto",
    "reqwest-blocking-client",
    "reqwest-rustls",
] }

[dev-dependencies]
tar.workspace = true

[build-dependencies]
# gzip rather than zstd, which doesn't build for wasm. Must match the
# dependency.
askalono.workspace = true
