[package]
name = "registry_api_shared"
version = "0.1.0"
edition = "2024"
resolver = "2"

[features]
default = []
# Exposes the test harness (`test::TestSetup`, tarball fixtures) and test-only
# constructors (e.g. `ExportsMap::mock()`) to downstream crates' test builds.
testing = ["dep:tar"]

[dependencies]
anyhow.workspace = true
bytes.workspace = true
chrono.workspace = true
deno_error.workspace = true
deno_graph.workspace = true
deno_semver.workspace = true
dotenvy.workspace = true
futures.workspace = true
hyper.workspace = true
indexmap.workspace = true
moka.workspace = true
once_cell.workspace = true
rand.workspace = true
rust-s3.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true
deno_ast.workspace = true
deno_doc.workspace = true
flate2.workspace = true
tar = { workspace = true, optional = true }
rmp-serde.workspace = true
reqwest.workspace = true
routerify.workspace = true
askalono.workspace = true
sqlx.workspace = true
percent-encoding.workspace = true

pin-project = "1.1.3"
tracing-opentelemetry = "0.28"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
opentelemetry = { version = "0.27", features = ["trace", "logs"] }
opentelemetry_sdk = { version = "0.27", features = [
    "rt-tokio",
    "trace",
    "logs",
] }
# Bridges `tracing` events into OpenTelemetry log records so the same logs we
# print to stdout are also exported over OTLP (to Grafana Cloud Loki).
opentelemetry-appender-tracing = "0.27"
# OTLP over HTTP/protobuf (not gRPC): the managed Grafana Cloud OTLP gateway only
# speaks OTLP/HTTP. `reqwest-client` routes export through reqwest (its own
# reqwest 0.12, separate from the app's reqwest 0.11). Default `grpc-tonic` is
# off. `http-proto` enables trace+metrics; `logs` is listed explicitly because
# it does not.
opentelemetry-otlp = { version = "0.27", default-features = false, features = [
    "trace",
    "logs",
    "http-proto",
    "reqwest-client",
] }
registry_api_macros = { path = "../macros" }
postmark = { version = "=0.10.0", features = ["reqwest-rustls-tls"] }
const_format = { version = "0.2", features = ["const_generics"] }

[dev-dependencies]
tar.workspace = true

[build-dependencies]
askalono.workspace = true
