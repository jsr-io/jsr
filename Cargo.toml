[workspace]
members = ["api", "macros", "shared", "tasks"]
resolver = "2"

[workspace.dependencies]
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
deno_semver = "0.10.1"
futures = "0.3"
hyper = { version = "0.14", features = [
    "http1",
    "http2",
    "client",
    "server",
    "stream",
] }
routerify = "3"
routerify-query = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
indexmap = { version = "2.13.0", features = ["serde"] }
url = "2.5.4"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["full"] }
deno_graph = "=0.111.0"
deno_ast = { version = "0.53.0", features = ["view"] }
# sync with frontend/deno.json
deno_doc = { version = "=0.207.0", features = ["comrak"] }
reqwest = { version = "0.11.18", default-features = false, features = [
    "rustls-tls",
    "stream",
    "gzip",
    "brotli",
    "json",
    "multipart",
] }
sha2 = "0.10.7"
thiserror = "2"
dotenvy = "0.15.7"
once_cell = "1"
regex = "1.10.2"
deno_error = "0.7.0"
anyhow = "1"
tar = "0.4"
base64 = "0.21"
moka = { version = "0.12", features = ["future", "sync"] }
rust-s3 = { version = "0.37.1", default-features = false, features = ["tokio-rustls-tls"] }
rand = "0.8"
flate2 = "1"
comrak = { version = "0.29.0", default-features = false }
rmp-serde = "1"
askalono = "0.5.0"
sqlx = { version = "0.8.6", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "migrate",
    "postgres",
    "macros",
    "uuid",
    "chrono",
    "json",
    "ipnetwork",
] }
async-trait = "0.1.73"
percent-encoding = "2"
